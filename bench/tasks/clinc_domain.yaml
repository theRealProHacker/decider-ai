# CLINC150 oos_plus, domain level + out_of_scope. Descriptions written from the
# 15 intent names per domain in data/domains.json (clinc/oos-eval @ 828f809);
# see docs/research/public-benchmark-datasets.md (section 2).
tasks:
  - name: clinc_domain
    question: "Which area does this request to a virtual assistant belong to?"
    labels:
      auto_and_commute: "Car care, gas, traffic, directions, distance, rides"
      banking: "Bank accounts, balances, transactions, transfers, bills, checks, fraud, interest rates"
      credit_cards: "Credit cards: limits, rewards, APR, applications, lost cards, credit score"
      home: "Shopping and to-do lists, reminders, calendar, playing music, orders, smart home"
      kitchen_and_dining: "Recipes, ingredients, nutrition, cooking times, restaurant suggestions and reservations"
      meta: "The assistant's own settings: name, language, voice; yes, no, cancel, repeat"
      small_talk: "Greetings, thanks, goodbyes, jokes and questions about the assistant itself"
      travel: "Flights, hotels, car rental, visas, luggage, exchange rates, translation"
      utility: "Time, date, weather, timers, alarms, calculator, definitions, spelling, calls and texts"
      work: "Meetings, PTO, paydays, income, taxes, insurance, 401k"
      out_of_scope: "A request none of these areas covers"
    max_input_tokens: 512
    zero_shot: false
